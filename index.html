<!DOCTYPE html>
<html>
<head>
  <title>Student Profile</title>
  <style>
    body {
      background-color: #f0f8ff; /* light blue background */
      font-family: Arial, sans-serif;
      color: #333;
    }
    h1 {
      color: #2e8b57; /* green heading */
      text-align: center;
    }
    p {
      font-size: 18px;
      color: #000080; /* navy text */
    }
    h2 {
      color: #8b0000; /* dark red subheading */
    }
    ol {
      background-color: #fffacd; /* light yellow list background */
      padding: 10px;
      border-radius: 8px;
    }
    li {
      color: #006400; /* dark green list items */
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Student Profile</h1>
  
  <p><strong>Name:</strong> Trisha</p>
  <p><strong>Age:</strong> 22</p>
  <p><strong>Course:</strong> MCA</p>
  
  <h2>Subjects:</h2>
  <ol>
    <li>DSA</li>
    <li>Python</li>
  </ol>
</body>
</html>
